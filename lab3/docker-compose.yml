version: '3.9'

services:
  spark:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spark
    volumes:
      - ./src/etl_pipeline.py:/app/etl_pipeline.py
      - ./src/bronze_loader.py:/app/bronze_loader.py
      - ./data:/app/data
      - ./mlruns:/app/mlruns
    working_dir: /app
    command: tail -f /dev/null
    ports:
      - "5000:5000"